[package]
name = "rti-store"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "rti-db columnar storage: MemTable, Segments, zone maps, Gorilla-style compression"

[features]
# S3 冷层骨架（SigV4 签名；零新增依赖，纯 safe 自实现 SHA-256/HMAC）。
s3 = []

[dependencies]
rti-core = { path = "../rti-core" }
rti-mem = { path = "../rti-mem" }
crc32fast = "1"
