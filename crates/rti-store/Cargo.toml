[package]
name = "rti-store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "rti-db columnar storage: MemTable, Segments, zone maps, Gorilla-style compression"

[features]
# S3 cold tier (SigV4 signing; zero new dependencies, pure-safe in-house SHA-256/HMAC).
s3 = []

[dependencies]
rti-core = { path = "../rti-core" , version = "0.8.0" }
rti-mem = { path = "../rti-mem" , version = "0.8.0" }
crc32fast = "1"
