[package]
name = "rti-wal"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "rti-db write-ahead log: append-only, CRC32, group commit, crash recovery"

[features]
default = []
# io_uring batched-submission backend (Linux only). The unsafe glue is isolated in the rti-wal-uring crate.
io-uring = ["dep:rti-wal-uring"]

[dependencies]
rti-core = { path = "../rti-core" }
crc32fast = "1"

[target.'cfg(target_os = "linux")'.dependencies]
rti-wal-uring = { path = "../rti-wal-uring", optional = true }

# v0.5 Stream B: uring-pipeline vs std comparison benchmark (requires a real ring).
[[example]]
name = "wal_bench"
required-features = ["io-uring"]
