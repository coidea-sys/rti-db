[package]
name = "rti-wal"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "rti-db write-ahead log: append-only, CRC32, group commit, crash recovery"

[features]
default = []
# io_uring 批量提交后端（Linux only）。unsafe 胶水隔离在 rti-wal-uring crate。
io-uring = ["dep:rti-wal-uring"]

[dependencies]
rti-core = { path = "../rti-core" }
crc32fast = "1"

[target.'cfg(target_os = "linux")'.dependencies]
rti-wal-uring = { path = "../rti-wal-uring", optional = true }

# v0.5 Stream B：uring-pipeline vs std 对比基准（需真实 ring）。
[[example]]
name = "wal_bench"
required-features = ["io-uring"]
