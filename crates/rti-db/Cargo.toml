[package]
name = "rti-db"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "rti-db facade: Db::open/put/scan, ingest pipeline, benches"

[features]
# hot-path allocation counting test hook (global counting allocator, test-only).
alloc-count = ["rti-mem/alloc-count"]
# v0.5: S3 cold tier end-to-end (forwards rti-store's s3 feature; pure-std HTTP, zero new dependencies).
s3 = ["rti-store/s3"]

[dependencies]
rti-core = { path = "../rti-core" }
rti-mem = { path = "../rti-mem" }
rti-buffer = { path = "../rti-buffer" }
rti-wal = { path = "../rti-wal" }
rti-store = { path = "../rti-store" }
rti-query = { path = "../rti-query" }
