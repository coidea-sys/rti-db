[package]
name = "rti-db"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "rti-db facade: Db::open/put/scan, ingest pipeline, benches"

[features]
# 热路径分配计数测试接口（全局计数分配器，仅测试用）。
alloc-count = ["rti-mem/alloc-count"]
# v0.5：S3 冷层端到端（透传 rti-store 的 s3 feature；纯 std HTTP，零新增依赖）。
s3 = ["rti-store/s3"]

[dependencies]
rti-core = { path = "../rti-core" }
rti-mem = { path = "../rti-mem" }
rti-buffer = { path = "../rti-buffer" }
rti-wal = { path = "../rti-wal" }
rti-store = { path = "../rti-store" }
rti-query = { path = "../rti-query" }
