[package]
name = "rti-edge"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "rti-db as an RTI-Edge data-plane component: preset profiles (safety island / cognition / planning), TSN-aligned ingest, unified health"

[features]
# hot-path allocation counting (forwards the rti-db/rti-mem global counting allocator, test-only).
alloc-count = ["rti-db/alloc-count"]

[dependencies]
rti-core = { path = "../rti-core" }
rti-query = { path = "../rti-query" }
rti-wal = { path = "../rti-wal" }
rti-store = { path = "../rti-store" }
rti-raft = { path = "../rti-raft" }
rti-db = { path = "../rti-db" }
