[workspace]
resolver = "2"
members = [
    "crates/rti-core",
    "crates/rti-mem",
    "crates/rti-buffer",
    "crates/rti-wal",
    "crates/rti-raft",
    "crates/rti-wal-uring",
    "crates/rti-store",
    "crates/rti-query",
    "crates/rti-net",
    "crates/rti-db",
    "crates/rti-edge",
    "crates/rti-vla",
    "crates/rti-export",
    "crates/rti-ros2",
]
exclude = ["bench"]

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/coidea-sys/rti-db"
homepage = "https://github.com/coidea-sys/rti-db"
description = "A hard-real-time embedded time-series data engine in Rust"
keywords = ["time-series", "real-time", "embedded", "edge", "database"]
categories = ["database", "embedded", "no-std"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
